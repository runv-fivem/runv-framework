<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <script src="vue.global.prod.js"></script>
</head>
<body>
<div id="app" v-cloak>
    <template v-if="view === 'nickname'">
        <div class="band">
            <div class="title">ENTER NICKNAME</div>
            <div class="input"><input ref="input" v-model="name" maxlength="16" spellcheck="false" @keydown.enter="confirm"></div>
        </div>
        <div class="bar">
            <div class="button" @click="confirm">CONFIRM</div>
        </div>
    </template>

    <div v-if="view === 'play'" class="button play" @click="play">PLAY</div>
</div>
<script src="app.js"></script>
</body>
</html>
