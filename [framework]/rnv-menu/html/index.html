<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <script src="vue.global.prod.js"></script>
</head>
<body>
<div id="app" v-cloak>
    <div class="pause" v-if="pause">
        <div class="panel">
            <div class="pname">{{ pause.name }}</div>
            <div class="uid">
                <div class="copy" @click="copyUid"><svg viewBox="0 0 24 24"><path d="M8 3h10v14h-2V5H8V3zM5 7h9v14H5V7z"/></svg></div>
                <span>UID: {{ pause.uid }}</span>
            </div>
            <div class="buttons">
                <div v-for="b in pauseButtons" :key="b.id" class="pbtn" :class="{ selected: pauseSel === b.id }"
                     @mouseenter="pauseSel = b.id" @click="pausePost(b.id)">
                    <svg v-if="b.id === 'party'" viewBox="0 0 24 24"><path d="M9 4a3 3 0 110 6 3 3 0 010-6zm7 1a2.5 2.5 0 110 5 2.5 2.5 0 010-5zM3 19c0-3.3 2.7-6 6-6s6 2.7 6 6H3zm13-6c2.5 0 5 1.5 5 4.5V19h-4.5c0-2.3-.8-4.3-2.2-5.6.5-.3 1.1-.4 1.7-.4zM19 9h2v2h2v2h-2v2h-2v-2h-2v-2h2V9z"/></svg>
                    <svg v-else-if="b.id === 'clan'" viewBox="0 0 24 24"><path d="M12 3a2.6 2.6 0 110 5.2A2.6 2.6 0 0112 3zM6 5a2.2 2.2 0 110 4.4A2.2 2.2 0 016 5zm12 0a2.2 2.2 0 110 4.4A2.2 2.2 0 0118 5zM8.4 10h7.2l1 6-2.2 1.2-.6 4.8h-3.6l-.6-4.8L7.4 16l1-6zm-6 1.4h3.8L5.4 16l-1.6.6-.4 3.4H1.6L1 15.4l1.4-4zm15.4 0h3.8l1.4 4-.6 4.6h-1.8l-.4-3.4-1.6-.6-.8-4.6z"/></svg>
                    <svg v-else-if="b.id === 'settings'" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7zm8.6 5l-1.4-.8a7.4 7.4 0 000-1.4l1.4-.8a1 1 0 00.4-1.3l-1.5-2.6a1 1 0 00-1.3-.4l-1.4.8a7 7 0 00-1.2-.7V4.5a1 1 0 00-1-1h-3a1 1 0 00-1 1v1.6c-.4.2-.8.4-1.2.7l-1.4-.8a1 1 0 00-1.3.4L3 9a1 1 0 00.4 1.3l1.4.8a7.4 7.4 0 000 1.4l-1.4.8A1 1 0 003 14.6l1.5 2.6a1 1 0 001.3.4l1.4-.8c.4.3.8.5 1.2.7v1.6a1 1 0 001 1h3a1 1 0 001-1v-1.6c.4-.2.8-.4 1.2-.7l1.4.8a1 1 0 001.3-.4l1.5-2.6a1 1 0 00-.4-1.3z"/></svg>
                    <svg v-else viewBox="0 0 24 24"><path d="M4 3h10v4h-2V5H6v14h6v-2h2v4H4V3zm12 4l5 5-5 5v-3H9v-4h7V7z"/></svg>
                    <span>{{ b.label }}</span>
                </div>
            </div>
            <div class="discord" v-if="pause.discord" @click="pausePost('discord')">JOIN OUR DISCORD
                <svg viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.4l-8.3 8.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>
            </div>
        </div>
        <div class="strip"><span>MENU</span></div>
    </div>

    <div class="settings" v-if="open">
        <div class="mark mark-left">SETTINGS</div>
        <div class="mark mark-right">SETTING.</div>

        <div class="title">SETTINGS</div>

        <div class="tabs">
            <div v-for="t in tabs" :key="t.id" class="tab" :class="{ active: tab === t.id }" @click="tab = t.id">{{ t.label }}</div>
        </div>

        <div class="rows" v-if="tab !== 'keys'">
            <template v-for="row in currentRows" :key="row.key || 'section-' + row.section">
            <div v-if="row.section" class="section">{{ row.section }}</div>
            <div v-else class="row" :class="{ disabled: !enabled(row), selected: selectedRow === row }" @mouseenter="selected = row.key">
                <div class="label">{{ row.label }}</div>

                <div class="control" v-if="row.type === 'select'">
                    <div class="arrow" @click="step(row, -1)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
                    <div class="value">{{ values[row.key] }}</div>
                    <div class="arrow" @click="step(row, 1)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
                </div>

                <div class="control" v-else-if="row.type === 'slider'">
                    <input type="range" :min="row.min" :max="row.max" :step="row.step" v-model.number="values[row.key]" @change="slid(row)"
                           :style="{ backgroundSize: fill(row) }" :disabled="!enabled(row)">
                    <div class="number">{{ number(row) }}</div>
                </div>

                <div class="control" v-else-if="row.type === 'action'">
                    <div class="act" @click="act(row)">SELECT</div>
                </div>

                <div class="control" v-else-if="row.type === 'display'">
                    <div class="bar"><div :style="{ width: (row.value / (row.max || 1)) * 100 + '%' }"></div></div>
                </div>

                <div class="control check-wrap" v-else>
                    <div class="check" :class="{ on: values[row.key] }" @click="toggle(row)">
                        <svg v-if="values[row.key]" viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg>
                    </div>
                </div>
            </div>
            </template>
        </div>

        <!-- KEY BINDINGS: GTA's key mapping categories; click a key to change it, the bin clears the row -->
        <div class="rows" v-else>
            <template v-if="keymap">
                <div class="row">
                    <div class="label">Category</div>
                    <div class="control">
                        <div class="arrow" @click="keyCategory(-1)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
                        <div class="value">{{ categoryLabel }}</div>
                        <div class="arrow" @click="keyCategory(1)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
                    </div>
                </div>
                <div class="row" v-if="restoreLabel">
                    <div class="label">{{ restoreLabel }}</div>
                    <div class="control"><div class="act" @click="restoreKeys">SELECT</div></div>
                </div>
                <div class="section">{{ categoryLabel }}</div>
                <div v-for="k in keymap.rows" :key="k.row" class="keyrow" :class="{ disabled: !k.mappable }">
                    <div class="label" :class="{ alert: k.alert }">{{ k.label }}</div>
                    <div v-for="slot in [0, 1]" :key="slot" class="keybox" :class="{ waiting: capSlot === k.row + ':' + slot }" @click="rebind(k, slot)">
                        {{ capSlot === k.row + ':' + slot ? 'PRESS A KEY' : (k.keys[slot] || 'Empty') }}
                    </div>
                    <div class="trash" @click="clearKeys(k)"><svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zM6 8h12l-1 13H7L6 8z"/></svg></div>
                </div>
            </template>
        </div>

        <div class="modal" v-if="warning">
            <div class="mbox">
                <div class="mtitle">CONFIRMATION</div>
                <div class="mtext">{{ warning.text }}</div>
                <div class="mbuttons">
                    <div class="btn" @click="answer('no')"><span class="key">ESC</span>NO</div>
                    <div class="btn" v-if="warning.alt" @click="answer('alt')"><span class="key">SPACE</span>OTHER</div>
                    <div class="btn yes" @click="answer('yes')"><span class="key">ENTER</span>YES</div>
                </div>
            </div>
        </div>

        <div class="desc" v-if="selectedRow && tab !== 'keys'">
            <div class="dtitle">{{ selectedRow.label }}</div>
            <div class="dtext">{{ selectedRow.desc }}</div>
        </div>

        <div class="confirm" @click="confirm"><span class="key">ENTER</span><span class="text">CONFIRM</span></div>

        <div class="bottom">
            <div class="btn" @click="back"><span class="key">ESC</span>BACK</div>
            <div class="btn" @click="reset"><span class="key">R</span>DEFAULT</div>
        </div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
