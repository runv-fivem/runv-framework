<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <script src="vue.global.prod.js"></script>
</head>
<body>
<div id="app" v-cloak :class="{ nokeys: !hud.keys }">
    <template v-if="hud.show">
        <div class="net"><span v-if="hud.showFps">FPS: {{ hud.fps }}</span><span v-if="hud.showPing">PING: {{ hud.ping }}MS</span></div>

        <!-- criminal indicator -->
        <div v-if="hud.role === 'criminal'" class="criminal">
            <svg viewBox="0 0 24 24"><path d="M10 2.5h4l-1 2.3h-2L10 2.5zm.6 3.3h2.8C17 7.6 19.5 11 19.5 15c0 3.9-3.3 6.5-7.5 6.5S4.5 18.9 4.5 15c0-4 2.5-7.4 6.1-9.2zM11.2 9v1.1c-1.4.3-2.3 1.2-2.3 2.4 0 1.5 1.2 2 2.6 2.4 1.1.3 1.5.5 1.5 1s-.5.8-1.2.8c-.8 0-1.3-.4-1.4-1H8.8c.1 1.3 1 2.2 2.4 2.5V19h1.6v-1c1.4-.3 2.3-1.2 2.3-2.4 0-1.6-1.3-2.1-2.7-2.5-1-.3-1.4-.5-1.4-.9s.4-.7 1-.7c.7 0 1.1.3 1.2.9h1.6c-.1-1.3-.9-2.1-2.1-2.4V9h-1.5z"/></svg>
        </div>

        <div class="compass">
            <div class="marker"></div>
            <div v-for="m in compassMarks" :key="m.angle" class="mark" :class="{ cardinal: m.cardinal }" :style="{ left: m.x + 'rem', opacity: m.opacity }">{{ m.label }}</div>
        </div>

        <div v-for="(m, i) in hud.mates" :key="m.name" class="card mate" :style="{ bottom: (12.4 + (hud.mates.length - 1 - i) * 5.6) + 'rem' }">
            <div class="row">
                <div class="dot" :style="{ background: m.color }"></div>
                <div class="name">{{ m.name }}<svg class="crown" v-if="m.leader" viewBox="0 0 24 24"><path d="M3 7l5 4 4-6 4 6 5-4-2 11H5L3 7z"/></svg></div>
            </div>
            <div class="bar health"><div class="fill" :style="{ width: m.health + '%' }"></div></div>
        </div>

        <div class="card">
            <div class="row">
                <div class="dot" :style="hud.myColor ? { background: hud.myColor } : null"></div>
                <div class="name">{{ hud.name }}<svg class="crown" v-if="hud.myLeader" viewBox="0 0 24 24"><path d="M3 7l5 4 4-6 4 6 5-4-2 11H5L3 7z"/></svg></div>
                <svg class="voice" :class="{ talking: hud.talking }" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/></svg>
            </div>
            <div class="bar armor"><div class="max" :style="{ width: hud.armorMax + '%' }"></div><div class="fill" :style="{ width: hud.armor + '%' }"></div></div>
            <div class="bar health"><div class="fill" :style="{ width: hud.health + '%' }"></div></div>
        </div>

        <div class="chip solo">
            <div class="circle">
                <svg viewBox="0 0 24 24"><path d="M4 3l3 5-1 5 3 4 3 4 3-4 3-4-1-5 3-5-5 3h-4L4 3zm5 9l2 1-1 1-1-2zm6 0l-1 2-1-1 2-1z"/></svg>
            </div>
            <div class="label">{{ hud.party > 1 ? 'PARTY' : 'SOLO' }}</div>
            <div class="key">J</div>
        </div>

        <!-- notoriety, city visit only -->
        <template v-if="hud.notoriety">
            <div class="chip lvl">
                <div class="circle"><svg viewBox="0 0 24 24"><path d="M12 2C8 2 6 5 6 9v4c0 4 2.7 8 6 8s6-4 6-8V9c0-4-2-7-6-7zm-3.2 8.2h2.4v1.6H8.8v-1.6zm4 0h2.4v1.6h-2.4v-1.6zM9.5 15h5c-.4 1.5-1.4 2.5-2.5 2.5S9.9 16.5 9.5 15z"/></svg></div>
                <div class="label">lvl {{ hud.notoriety.level }}</div>
            </div>
            <div class="chip bonus b1">
                <div class="circle"><svg viewBox="0 0 24 24"><path d="M3 8l7-3 7 3v8l-7 3-7-3V8zm7 1.2L5.5 7.6 10 9.5l4.5-1.9L10 5.9zM18 6l3 3h-2v5h-2V9h-2l3-3z"/></svg></div>
                <div class="label">+{{ hud.notoriety.bonus.cargo }}%</div>
            </div>
            <div class="chip bonus b2">
                <div class="circle"><svg viewBox="0 0 24 24"><path d="M9 3h2v2c1.7.3 3 1.5 3 3h-2c0-.6-.7-1.2-2-1.2S8 7.4 8 8s.8 1 2.3 1.4C12.6 10 14 10.8 14 13c0 1.5-1.3 2.7-3 3v2H9v-2c-1.7-.3-3-1.5-3-3h2c0 .7.8 1.2 2 1.2s2-.5 2-1.2-.7-1-2.3-1.4C7.5 11 6 10.2 6 8c0-1.5 1.3-2.7 3-3V3zm10 3l3 3h-2v5h-2V9h-2l3-3z"/></svg></div>
                <div class="label">+{{ hud.notoriety.bonus.fence }}%</div>
            </div>
            <div class="chip bonus b3">
                <div class="circle"><svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5zm0 3.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm-5 4a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm10 0a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm-5 5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/></svg></div>
                <div class="label">+{{ hud.notoriety.bonus.loot }}%</div>
            </div>
        </template>

        <div class="hands">
            <div class="box">
                <svg viewBox="0 0 24 24"><path d="M6 21l-2-7V7.5a1 1 0 012 0V12h.5V5a1 1 0 012 0v7H9V4a1 1 0 012 0v8l.5 1 .5-1V4a1 1 0 012 0v8h.5V5a1 1 0 012 0v7h.5V7.5a1 1 0 012 0V14l-2 7h-2l1-5-2-2-2 2 1 5H6z"/></svg>
            </div>
            <div class="key">Q</div>
        </div>

        <div class="slots">
            <div v-for="n in (armed ? 6 : 0)" :key="n" class="slot" :class="{ wide: n <= 2 }">
                <div class="box" :class="{ filled: weapon(n), equipped: weapon(n) && weapon(n).equipped }">
                    <template v-if="weapon(n)">
                        <img :src="weapon(n).image">
                        <span class="ammo">{{ weapon(n).ammo }}</span>
                    </template>
                    <svg v-else viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>
                </div>
                <div class="key">{{ n }}</div>
            </div>
            <div class="divider" v-if="armed"></div>
            <div class="slot bag">
                <div class="box">
                    <svg viewBox="0 0 24 24"><path d="M9 6V4h6v2h3l2 4v8H4v-8l2-4h3zm1 0h4V5h-4v1z"/></svg>
                    <div class="fill"><div :style="{ width: '0%' }"></div></div>
                </div>
                <div class="key">TAB</div>
            </div>
        </div>
    </template>

    <div class="notifications">
        <div v-for="n in notifications" :key="n.id" class="notify" :style="{ borderLeftColor: n.color }">
            <div class="icon" :style="{ background: n.color }"></div>
            <div class="text"><span v-for="(p, i) in n.parts" :key="i" :class="{ hl: p.hl }" :style="p.hl ? { color: n.color } : null">{{ p.text }}</span></div>
            <div class="countdown" v-if="n.countdown !== undefined" :style="{ color: n.color }">{{ clock(n.countdown) }}</div>
            <div class="nkeys" v-if="n.keys"><span v-for="k in n.keys" :key="k.key" class="nkey"><b>{{ k.key }}</b>{{ k.label }}</span></div>
        </div>
    </div>

    <div class="progress" v-if="progress">
        <div class="label">{{ progress.label }}</div>
        <div class="track"><div class="fill" :style="{ width: progress.width + '%', transitionDuration: progress.duration + 'ms' }"></div></div>
    </div>

    <div v-for="(t, i) in tags" :key="'t' + i" class="tag" :class="'r-' + t.role" :style="{ left: t.x + '%', top: t.y + '%' }"><i v-if="t.dot" :style="{ background: t.dot }"></i>{{ t.name }}</div>
    <div v-for="h in hits" :key="h.id" class="hit" :style="{ left: h.x + '%', top: h.y + '%' }">{{ h.amount }}</div>

    <div class="jail" v-if="jail !== null && hud.show">
        <svg viewBox="0 0 24 24"><path d="M8 3v4H4v2h4v6H4v2h4v4h2v-4h4v4h2v-4h4v-2h-4V9h4V7h-4V3h-2v4h-4V3H8zm2 6h4v6h-4V9z"/></svg>
        <span class="label">JAIL TIME</span><span class="years">{{ jail }} YEARS</span>
    </div>

    <transition-group name="pick" tag="div" class="pickfeed">
        <div v-for="c in picks" :key="c.id" class="pick">
            <i class="pbar" :style="{ background: c.color }"></i>
            <div class="pbody"><img :src="c.image"><span>{{ c.text }}</span></div>
        </div>
    </transition-group>

    <i v-for="(m, i) in marks" :key="'m' + i" class="mark" :style="{ left: m.x + 'vw', top: m.y + 'vh' }"></i>

    <div class="prompt" v-if="prompt">
        <template v-if="prompt.options">
            <div class="mtitle"><i v-if="prompt.rarity" class="rbar" :style="{ background: prompt.rarity }"></i><svg v-if="prompt.options.length > 1" class="mwheel" viewBox="0 0 24 24"><path d="M8 3h4v8H5V7a4 4 0 013-4zm5 0h0a4 4 0 014 4v4h-4V3zM5 12h12v5a6 6 0 01-12 0v-5zM19 8l2-2 2 2h-4zm0 2h4l-2 2-2-2z"/></svg><span class="ttl">{{ prompt.title }}</span></div>
            <div v-for="(o, i) in prompt.options" :key="i" class="mrow">
                <span v-if="i + 1 === prompt.sel" class="pkey">{{ prompt.key }}</span>
                <div class="mopt" :class="{ sel: i + 1 === prompt.sel }">
                    <svg class="micon" viewBox="0 0 24 24"><path :d="icons[o.icon] || icons.card"/></svg>
                    <span>{{ o.label }}</span><span v-if="o.price" class="mprice">{{ o.price }}</span>
                </div>
            </div>
        </template>
        <template v-else>
            <div class="ptitle"><i v-if="prompt.rarity" class="rbar" :style="{ background: prompt.rarity }"></i><span class="ttl">{{ prompt.title }}</span></div>
            <div class="prow"><span class="pkey">{{ prompt.key }}</span><div class="pbtn">{{ prompt.label }}</div></div>
        </template>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
